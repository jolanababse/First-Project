<!doctype html>
<html lang="he">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #intro-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: var(--sans);
          color: var(--ivory);
        }
        /* ambient light motes (decorative) */
      .mote {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(212, 175, 114, 0.55) 0%, rgba(212, 175, 114, 0) 70%);
      }

      /* scene groups: flex-centered, full frame, title-safe padding */
      .scene {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 40px;
        padding: 260px 120px 420px;
        direction: rtl;
        text-align: center;
        opacity: 0;
      }
      .line {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0 0.28em;
      }
      .word {
        display: inline-block;
      }
      .gold {
        color: var(--gold);
      }

      /* hook */
      #hook-title {
        font-family: var(--serif);
        font-weight: 500;
        font-size: 168px;
        line-height: 1.05;
        letter-spacing: -0.01em;
      }
      #hook-sub {
        font-weight: 300;
        font-size: 58px;
        line-height: 1.3;
        color: var(--ivory-dim);
      }

      /* build: decant lineup */
      #build-title {
        font-family: var(--serif);
        font-weight: 500;
        font-size: 112px;
        line-height: 1.1;
      }
      .lineup {
        position: relative;
        display: flex;
        direction: rtl;
        align-items: flex-end;
        justify-content: center;
        width: 840px;
      }
      .lineup-glow {
        position: absolute;
        left: 20px;
        top: 20px;
        width: 800px;
        height: 760px;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(212, 175, 114, 0.34), rgba(212, 175, 114, 0.1) 55%, rgba(212, 175, 114, 0));
      }
      .product {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 280px;
      }
      .product-stage {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: flex-end;
        width: 280px;
        height: 800px;
      }
      .bottle-shadow {
        position: absolute;
        left: 50px;
        bottom: 0;
        width: 180px;
        height: 30px;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(10, 2, 5, 0.75), rgba(10, 2, 5, 0));
      }
      .bottle {
        position: relative;
        margin-bottom: 14px;
        transform-origin: 50% 100%;
      }
      .bottle-float {
        position: relative;
        width: 100%;
        height: 100%;
      }
      .bottle-img {
        display: block;
        width: 100%;
        height: 100%;
      }
      .bottle-sheen {
        position: absolute;
        inset: 0;
        overflow: hidden;
        -webkit-mask-size: 100% 100%;
        mask-size: 100% 100%;
      }
      #p2-sheen-mask {
        -webkit-mask-image: url("assets/brand/decant-2ml.png");
        mask-image: url("assets/brand/decant-2ml.png");
      }
      #p2-bottle {
        width: 108px;
        height: 540px;
      }
      #p5-sheen-mask {
        -webkit-mask-image: url("assets/brand/decant-5ml.png");
        mask-image: url("assets/brand/decant-5ml.png");
      }
      #p5-bottle {
        width: 137px;
        height: 650px;
      }
      #p10-sheen-mask {
        -webkit-mask-image: url("assets/brand/decant-10ml.png");
        mask-image: url("assets/brand/decant-10ml.png");
      }
      #p10-bottle {
        width: 159px;
        height: 760px;
      }
      .sheen-band {
        position: absolute;
        top: -5%;
        left: 0;
        width: 80px;
        height: 110%;
        background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0));
      }
      .chip {
        display: block;
        padding: 16px 38px;
        border: 2px solid var(--gold);
        border-radius: 999px;
        font-weight: 400;
        font-size: 54px;
        line-height: 1.2;
        color: var(--gold);
        margin-top: 34px;
      }

      /* punch */
      #punch-title {
        font-family: var(--serif);
        font-weight: 500;
        font-size: 150px;
        line-height: 1.15;
      }
      /* resolve */
      #logo-emblem {
        display: block;
        width: 230px;
        height: auto;
      }
      #logo-wordmark-wrap {
        display: block;
        width: 760px;
      }
      #logo-wordmark {
        display: block;
        width: 100%;
        height: auto;
      }
      .rule {
        width: 560px;
        height: 3px;
        background: linear-gradient(90deg, rgba(212, 175, 114, 0), var(--gold) 20%, var(--gold) 80%, rgba(212, 175, 114, 0));
        transform-origin: 50% 50%;
      }
      #resolve-url {
        direction: ltr;
        font-weight: 400;
        font-size: 50px;
        color: var(--ivory-dim);
        letter-spacing: 0.08em;
      }
          </style>

      <div id="intro-root" data-composition-id="intro" data-width="1080" data-height="1920">
        <div class="mote" id="mote-1" style="left: 80px; top: 1500px; width: 220px; height: 220px"></div>
        <div class="mote" id="mote-2" style="left: 780px; top: 1650px; width: 160px; height: 160px"></div>
        <div class="mote" id="mote-3" style="left: 860px; top: 520px; width: 120px; height: 120px"></div>
        <div class="mote" id="mote-4" style="left: 140px; top: 380px; width: 90px; height: 90px"></div>
        <div class="mote" id="mote-5" style="left: 520px; top: 1780px; width: 260px; height: 260px"></div>
        <div class="mote" id="mote-6" style="left: 40px; top: 980px; width: 70px; height: 70px"></div>

        <!-- 1 · Hook -->
        <section class="scene" id="hook">
          <div class="line" id="hook-title">
            <span class="word">בושם</span>
            <span class="word gold">נישה?</span>
          </div>
          <div class="line" id="hook-sub">
            <span class="word">בלי</span>
            <span class="word">להתחייב</span>
            <span class="word">לבקבוק</span>
            <span class="word">מלא</span>
          </div>
        </section>

        <!-- 2 · Build -->
        <section class="scene" id="build">
          <div class="line" id="build-title">
            <span class="word">נסו</span>
            <span class="word">קודם</span>
            <span class="word gold">בדיקנט</span>
          </div>
          <div class="lineup" id="lineup">
            <div class="lineup-glow" id="lineup-glow"></div>
            <div class="product">
              <div class="product-stage">
                <div class="bottle-shadow" id="p2-shadow"></div>
                <div class="bottle" id="p2-bottle">
                  <div class="bottle-float" id="p2-float">
                    <img class="bottle-img" src="assets/brand/decant-2ml.png" alt="FRALORA 2 ml decant" />
                    <div class="bottle-sheen" id="p2-sheen-mask" data-layout-allow-overflow="true">
                      <div class="sheen-band" id="p2-sheen"></div>
                    </div>
                  </div>
                </div>
              </div>
              <span class="chip" id="chip-2">2 מ״ל</span>
            </div>
            <div class="product">
              <div class="product-stage">
                <div class="bottle-shadow" id="p5-shadow"></div>
                <div class="bottle" id="p5-bottle">
                  <div class="bottle-float" id="p5-float">
                    <img class="bottle-img" src="assets/brand/decant-5ml.png" alt="FRALORA 5 ml decant" />
                    <div class="bottle-sheen" id="p5-sheen-mask" data-layout-allow-overflow="true">
                      <div class="sheen-band" id="p5-sheen"></div>
                    </div>
                  </div>
                </div>
              </div>
              <span class="chip" id="chip-5">5 מ״ל</span>
            </div>
            <div class="product">
              <div class="product-stage">
                <div class="bottle-shadow" id="p10-shadow"></div>
                <div class="bottle" id="p10-bottle">
                  <div class="bottle-float" id="p10-float">
                    <img class="bottle-img" src="assets/brand/decant-10ml.png" alt="FRALORA 10 ml decant" />
                    <div class="bottle-sheen" id="p10-sheen-mask" data-layout-allow-overflow="true">
                      <div class="sheen-band" id="p10-sheen"></div>
                    </div>
                  </div>
                </div>
              </div>
              <span class="chip" id="chip-10">10 מ״ל</span>
            </div>
          </div>
        </section>

        <!-- 3 · Punch -->
        <section class="scene" id="punch">
          <div class="line" id="punch-title">
            <span class="word">גלו</span>
            <span class="word">את</span>
            <span class="word gold">הריח</span>
            <span class="word">הבא</span>
            <span class="word">שלכם</span>
          </div>
        </section>

        <!-- 4 · Resolve -->
        <section class="scene" id="resolve">
          <img id="logo-emblem" src="assets/brand/emblem-white.png" alt="" />
          <div id="logo-wordmark-wrap"><img id="logo-wordmark" src="assets/brand/wordmark-white.png" alt="FRALORA PARIS" /></div>
          <div class="rule" id="rule"></div>
          <div id="resolve-url">fralora.co.il</div>
        </section>
      </div>

      <script>
      const tl = gsap.timeline({ paused: true });

      // ambient drift across the whole piece
      [
        ["#mote-1", -260, 0.7],
        ["#mote-2", -340, 0.55],
        ["#mote-3", -180, 0.45],
        ["#mote-4", -120, 0.35],
        ["#mote-5", -420, 0.5],
        ["#mote-6", -200, 0.4],
      ].forEach(([sel, dy, op]) => {
        tl.fromTo(sel, { y: 0, opacity: 0 }, { y: dy, opacity: op, duration: 10, ease: "sine.inOut" }, 0);
      });

      // 1 · Hook (0 – 2.7)
      tl.set("#hook", { opacity: 1 }, 0);
      tl.fromTo(
        "#hook-title .word",
        { opacity: 0, y: 70, filter: "blur(18px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.8, ease: "power3.out", stagger: 0.22 },
        0.15
      );
      tl.fromTo(
        "#hook-sub .word",
        { opacity: 0, y: 30 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", stagger: 0.09 },
        0.95
      );
      tl.fromTo("#hook-title .gold", { scale: 1 }, { scale: 1.08, duration: 0.3, ease: "power2.out", yoyo: true, repeat: 1 }, 1.7);
      tl.to("#hook", { opacity: 0, y: -80, duration: 0.45, ease: "power2.in" }, 2.3);

      // 2 · Build (2.7 – 5.9)
      tl.fromTo("#build", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 2.65);
      tl.fromTo(
        "#build-title .word",
        { opacity: 0, y: 40, filter: "blur(12px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "power3.out", stagger: 0.14 },
        2.75
      );
      tl.fromTo("#lineup-glow", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 1.0, ease: "power2.out" }, 2.85);
      ["2", "5", "10"].forEach((k, i) => {
        const t = 2.9 + i * 0.2;
        tl.fromTo(
          `#p${k}-bottle`,
          { opacity: 0, y: 260, rotation: -8 },
          { opacity: 1, y: 0, rotation: 0, duration: 0.95, ease: "power3.out" },
          t
        );
        tl.fromTo(`#p${k}-shadow`, { opacity: 0, scaleX: 0.4 }, { opacity: 1, scaleX: 1, duration: 0.95, ease: "power3.out" }, t);
        tl.fromTo(`#chip-${k}`, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.2)" }, t + 0.65);
        // light sweep across the glass
        tl.fromTo(`#p${k}-sheen`, { x: -110 }, { x: 200, duration: 0.8, ease: "power2.inOut" }, 3.9 + i * 0.15);
        // gentle hover, phase-offset per bottle
        const tilt = i % 2 ? -1.2 : 1.2;
        tl.fromTo(`#p${k}-float`, { y: 0, rotation: 0 }, { y: -14, rotation: tilt, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 4.0 + i * 0.15);
        tl.fromTo(
          `#p${k}-shadow`,
          { scaleX: 1 },
          { scaleX: 0.86, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false },
          4.0 + i * 0.15
        );
      });
      tl.to("#build", { opacity: 0, scale: 0.96, duration: 0.4, ease: "power2.in" }, 5.55);

      // 3 · Punch (5.9 – 8.1)
      tl.set("#punch", { opacity: 1 }, 5.9);
      tl.fromTo(
        "#punch-title .word",
        { opacity: 0, y: 60, filter: "blur(14px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "power3.out", stagger: 0.16 },
        5.95
      );
      tl.fromTo("#punch-title .gold", { scale: 1 }, { scale: 1.08, duration: 0.3, ease: "power2.out", yoyo: true, repeat: 1 }, 7.0);
      tl.to("#punch", { opacity: 0, duration: 0.35, ease: "power1.in" }, 7.8);

      // 4 · Resolve (8.1 – 10)
      tl.set("#resolve", { opacity: 1 }, 8.1);
      tl.fromTo(
        "#logo-emblem",
        { opacity: 0, scale: 0.7, y: 30, filter: "blur(10px)" },
        { opacity: 1, scale: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "expo.out" },
        8.15
      );
      tl.fromTo(
        "#logo-wordmark",
        { opacity: 0, clipPath: "inset(0% 50% 0% 50%)" },
        { opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: 0.8, ease: "power3.inOut" },
        8.4
      );
      tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.inOut" }, 8.75);
      tl.fromTo("#resolve-url", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 8.95);

      window.__timelines["intro"] = tl;
                </script>
    </template>
  </body>
</html>
