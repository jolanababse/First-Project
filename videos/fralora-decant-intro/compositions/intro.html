<!doctype html>
<html lang="he">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #intro-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: var(--sans);
          color: var(--ivory);
        }
        /* ambient light motes (decorative) */
      .mote {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(212, 175, 114, 0.55) 0%, rgba(212, 175, 114, 0) 70%);
      }

      /* scene groups: flex-centered, full frame, title-safe padding */
      .scene {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 40px;
        padding: 260px 120px 420px;
        direction: rtl;
        text-align: center;
        opacity: 0;
      }
      .line {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0 0.28em;
      }
      .word {
        display: inline-block;
      }
      .gold {
        color: var(--gold);
      }

      /* hook */
      #hook-title {
        font-family: var(--serif);
        font-weight: 500;
        font-size: 168px;
        line-height: 1.05;
        letter-spacing: -0.01em;
      }
      #hook-sub {
        font-weight: 300;
        font-size: 58px;
        line-height: 1.3;
        color: var(--ivory-dim);
      }

      /* build: vial */
      #build-title {
        font-family: var(--serif);
        font-weight: 500;
        font-size: 112px;
        line-height: 1.1;
      }
      .vial-wrap {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 220px;
        height: 760px;
      }
      .vial-cap {
        width: 96px;
        height: 120px;
        border-radius: 14px 14px 6px 6px;
        background: linear-gradient(90deg, var(--gold-deep), var(--gold) 45%, #f1d9a6 55%, var(--gold-deep));
      }
      .vial-neck {
        width: 70px;
        height: 26px;
        background: var(--glass);
        border: 3px solid var(--glass-edge);
        border-top: none;
        border-bottom: none;
      }
      .vial-body {
        position: relative;
        width: 170px;
        height: 600px;
        border: 3px solid var(--glass-edge);
        border-radius: 22px 22px 85px 85px;
        background: var(--glass);
        overflow: hidden;
      }
      .liquid {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 100%;
        transform-origin: 50% 100%;
        background: linear-gradient(180deg, rgba(240, 200, 120, 0.95) 0%, var(--amber) 30%, #b97d33 100%);
      }
      .shine {
        position: absolute;
        top: -10%;
        left: 0;
        width: 60px;
        height: 120%;
        background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0));
      }
      .chips {
        display: flex;
        gap: 28px;
        direction: rtl;
      }
      .chip {
        display: block;
        padding: 16px 38px;
        border: 2px solid var(--gold);
        border-radius: 999px;
        font-weight: 400;
        font-size: 54px;
        line-height: 1.2;
        color: var(--gold);
      }

      /* punch */
      #punch-title {
        font-family: var(--serif);
        font-weight: 500;
        font-size: 150px;
        line-height: 1.15;
      }
      /* resolve */
      #logo-emblem {
        display: block;
        width: 230px;
        height: auto;
      }
      #logo-wordmark-wrap {
        display: block;
        width: 760px;
      }
      #logo-wordmark {
        display: block;
        width: 100%;
        height: auto;
      }
      .vial-emblem {
        position: absolute;
        left: 50%;
        top: 250px;
        width: 72px;
        height: auto;
        margin-left: -36px;
        opacity: 0.85;
      }
      .rule {
        width: 560px;
        height: 3px;
        background: linear-gradient(90deg, rgba(212, 175, 114, 0), var(--gold) 20%, var(--gold) 80%, rgba(212, 175, 114, 0));
        transform-origin: 50% 50%;
      }
      #resolve-url {
        direction: ltr;
        font-weight: 400;
        font-size: 50px;
        color: var(--ivory-dim);
        letter-spacing: 0.08em;
      }
          </style>

      <div id="intro-root" data-composition-id="intro" data-width="1080" data-height="1920">
        <div class="mote" id="mote-1" style="left: 80px; top: 1500px; width: 220px; height: 220px"></div>
        <div class="mote" id="mote-2" style="left: 780px; top: 1650px; width: 160px; height: 160px"></div>
        <div class="mote" id="mote-3" style="left: 860px; top: 520px; width: 120px; height: 120px"></div>
        <div class="mote" id="mote-4" style="left: 140px; top: 380px; width: 90px; height: 90px"></div>
        <div class="mote" id="mote-5" style="left: 520px; top: 1780px; width: 260px; height: 260px"></div>
        <div class="mote" id="mote-6" style="left: 40px; top: 980px; width: 70px; height: 70px"></div>

        <!-- 1 · Hook -->
        <section class="scene" id="hook">
          <div class="line" id="hook-title">
            <span class="word">בושם</span>
            <span class="word gold">נישה?</span>
          </div>
          <div class="line" id="hook-sub">
            <span class="word">בלי</span>
            <span class="word">להתחייב</span>
            <span class="word">לבקבוק</span>
            <span class="word">מלא</span>
          </div>
        </section>

        <!-- 2 · Build -->
        <section class="scene" id="build">
          <div class="line" id="build-title">
            <span class="word">נסו</span>
            <span class="word">קודם</span>
            <span class="word gold">בדיקנט</span>
          </div>
          <div class="vial-wrap" id="vial">
            <div class="vial-cap"></div>
            <div class="vial-neck"></div>
            <div class="vial-body">
              <div class="liquid" id="liquid"></div>
              <img class="vial-emblem" id="vial-emblem" src="assets/brand/emblem-white-small.png" alt="" />
              <div class="shine" id="shine" data-layout-allow-overflow="true"></div>
            </div>
          </div>
          <div class="chips">
            <span class="chip" id="chip-2">2 מ״ל</span>
            <span class="chip" id="chip-5">5 מ״ל</span>
            <span class="chip" id="chip-10">10 מ״ל</span>
          </div>
        </section>

        <!-- 3 · Punch -->
        <section class="scene" id="punch">
          <div class="line" id="punch-title">
            <span class="word">גלו</span>
            <span class="word">את</span>
            <span class="word gold">הריח</span>
            <span class="word">הבא</span>
            <span class="word">שלכם</span>
          </div>
        </section>

        <!-- 4 · Resolve -->
        <section class="scene" id="resolve">
          <img id="logo-emblem" src="assets/brand/emblem-white.png" alt="" />
          <div id="logo-wordmark-wrap"><img id="logo-wordmark" src="assets/brand/wordmark-white.png" alt="FRALORA PARIS" /></div>
          <div class="rule" id="rule"></div>
          <div id="resolve-url">fralora.co.il</div>
        </section>
      </div>

      <script>
      const tl = gsap.timeline({ paused: true });

      // ambient drift across the whole piece
      [
        ["#mote-1", -260, 0.7],
        ["#mote-2", -340, 0.55],
        ["#mote-3", -180, 0.45],
        ["#mote-4", -120, 0.35],
        ["#mote-5", -420, 0.5],
        ["#mote-6", -200, 0.4],
      ].forEach(([sel, dy, op]) => {
        tl.fromTo(sel, { y: 0, opacity: 0 }, { y: dy, opacity: op, duration: 10, ease: "sine.inOut" }, 0);
      });

      // 1 · Hook (0 – 2.7)
      tl.set("#hook", { opacity: 1 }, 0);
      tl.fromTo(
        "#hook-title .word",
        { opacity: 0, y: 70, filter: "blur(18px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.8, ease: "power3.out", stagger: 0.22 },
        0.15
      );
      tl.fromTo(
        "#hook-sub .word",
        { opacity: 0, y: 30 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", stagger: 0.09 },
        0.95
      );
      tl.fromTo("#hook-title .gold", { scale: 1 }, { scale: 1.08, duration: 0.3, ease: "power2.out", yoyo: true, repeat: 1 }, 1.7);
      tl.to("#hook", { opacity: 0, y: -80, duration: 0.45, ease: "power2.in" }, 2.3);

      // 2 · Build (2.7 – 5.9)
      tl.fromTo("#build", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 2.65);
      tl.fromTo(
        "#build-title .word",
        { opacity: 0, y: 40, filter: "blur(12px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "power3.out", stagger: 0.14 },
        2.75
      );
      tl.fromTo("#vial", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 2.9);
      tl.fromTo("#liquid", { scaleY: 0 }, { scaleY: 0.8, duration: 1.4, ease: "power2.inOut" }, 3.2);
      tl.fromTo("#shine", { x: -90 }, { x: 220, duration: 0.8, ease: "power1.inOut" }, 4.5);
      ["#chip-2", "#chip-5", "#chip-10"].forEach((sel, i) => {
        tl.fromTo(sel, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.2)" }, 4.3 + i * 0.15);
      });
      tl.to("#build", { opacity: 0, scale: 0.96, duration: 0.4, ease: "power2.in" }, 5.55);

      // 3 · Punch (5.9 – 8.1)
      tl.set("#punch", { opacity: 1 }, 5.9);
      tl.fromTo(
        "#punch-title .word",
        { opacity: 0, y: 60, filter: "blur(14px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "power3.out", stagger: 0.16 },
        5.95
      );
      tl.fromTo("#punch-title .gold", { scale: 1 }, { scale: 1.08, duration: 0.3, ease: "power2.out", yoyo: true, repeat: 1 }, 7.0);
      tl.to("#punch", { opacity: 0, duration: 0.35, ease: "power1.in" }, 7.8);

      // 4 · Resolve (8.1 – 10)
      tl.set("#resolve", { opacity: 1 }, 8.1);
      tl.fromTo(
        "#logo-emblem",
        { opacity: 0, scale: 0.7, y: 30, filter: "blur(10px)" },
        { opacity: 1, scale: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "expo.out" },
        8.15
      );
      tl.fromTo(
        "#logo-wordmark",
        { opacity: 0, clipPath: "inset(0% 50% 0% 50%)" },
        { opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: 0.8, ease: "power3.inOut" },
        8.4
      );
      tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.inOut" }, 8.75);
      tl.fromTo("#resolve-url", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 8.95);

      window.__timelines["intro"] = tl;
                </script>
    </template>
  </body>
</html>
