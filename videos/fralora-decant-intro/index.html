<!doctype html>
<html lang="he">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
@font-face {
        font-family: "Frank Ruhl Libre";
        font-weight: 300;
        src: url("assets/fonts/frank-ruhl-libre-hebrew-300-normal.woff2") format("woff2");
        unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F;
      }
@font-face {
        font-family: "Frank Ruhl Libre";
        font-weight: 300;
        src: url("assets/fonts/frank-ruhl-libre-latin-300-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+2000-206F;
      }
@font-face {
        font-family: "Frank Ruhl Libre";
        font-weight: 500;
        src: url("assets/fonts/frank-ruhl-libre-hebrew-500-normal.woff2") format("woff2");
        unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F;
      }
@font-face {
        font-family: "Frank Ruhl Libre";
        font-weight: 500;
        src: url("assets/fonts/frank-ruhl-libre-latin-500-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+2000-206F;
      }
@font-face {
        font-family: "Heebo";
        font-weight: 300;
        src: url("assets/fonts/heebo-hebrew-300-normal.woff2") format("woff2");
        unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F;
      }
@font-face {
        font-family: "Heebo";
        font-weight: 300;
        src: url("assets/fonts/heebo-latin-300-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+2000-206F;
      }
@font-face {
        font-family: "Heebo";
        font-weight: 400;
        src: url("assets/fonts/heebo-hebrew-400-normal.woff2") format("woff2");
        unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F;
      }
@font-face {
        font-family: "Heebo";
        font-weight: 400;
        src: url("assets/fonts/heebo-latin-400-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+2000-206F;
      }

      :root {
        --plum-deep: #140b12;
        --plum: #2a1524;
        --plum-glow: #4a2340;
        --ivory: #f4ece0;
        --ivory-dim: #cdbfae;
        --gold: #d4af72;
        --gold-deep: #a9813f;
        --amber: #e7b765;
        --glass: rgba(244, 236, 224, 0.07);
        --glass-edge: rgba(244, 236, 224, 0.38);
        --serif: "Frank Ruhl Libre", serif;
        --sans: "Heebo", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--plum-deep);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(120% 70% at 50% 38%, var(--plum-glow) 0%, var(--plum) 42%, var(--plum-deep) 100%);
      }
      .clip {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1080" data-height="1920">
      <div
        id="intro"
        class="clip"
        data-composition-id="intro"
        data-composition-src="compositions/intro.html"
        data-start="0"
        data-duration="10"
        data-track-index="0"
      ></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
